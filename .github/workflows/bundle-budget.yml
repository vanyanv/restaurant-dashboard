name: Bundle budget

# Runs on PRs AND on direct pushes to main. ci.yml added the push trigger for
# a reason it spells out — "Work reaches main by direct push here as often as
# by PR, and a pull_request-only trigger means those commits are never checked
# at all" — and that lesson was never applied here. It is how 21 of 87 routes
# drifted 1.8x over budget without anyone being told.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.mjs'
      - 'scripts/check-bundle-size.ts'
      - '.github/workflows/bundle-budget.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.mjs'
      - 'scripts/check-bundle-size.ts'
      - '.github/workflows/bundle-budget.yml'
  workflow_dispatch:

concurrency:
  group: bundle-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # The build only needs envs that the static analysis touches.
          # Server actions & runtime config are not exercised here.
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          NEXTAUTH_SECRET: ci-placeholder
          NEXTAUTH_URL: http://localhost:3000
        run: npm run build

      - name: Check per-route bundle budgets
        id: budget
        run: |
          # `|| true` so a failure does not abort before the table is
          # written: under `bash -e` the assignment itself is the failing
          # command, and the step summary — the whole point of capturing the
          # output — never got written on the one run where it mattered.
          report=$(npm run bundle:check 2>&1) || status=$?
          echo "$report"
          {
            echo "## Bundle budget check"
            echo ""
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"
