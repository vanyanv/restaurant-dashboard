name: ML Nightly (revenue forecast)

# Phase 5 ML pipeline. Trains XGBoost revenue models per store, generates
# 14-day forecasts, writes predictions + run metadata to Postgres. The
# Next.js dashboard ONLY reads those tables — never train inside Vercel.
#
# Schedule: 06:00 UTC = 02:00 America/New_York. Runs after the otter-sync
# workflow which lands the previous day's revenue around 01:00 ET.

on:
  schedule:
    # 10:00 UTC = 03:00 PT. The Pacific business day ends at 07:00 UTC (PDT) and
    # otter-sync runs at 08:00, so day D-1 is complete and synced by the time we
    # train. At 06:00 UTC it was not: the last sync before it was 04:00 UTC =
    # 21:00 PT, and this store takes 31.9% of daily net sales after 21:00, so
    # the newest day arrived ~68% written and dragged lag_1 down with it.
    # `trim_incomplete_trailing_days` guards the winter edge, when PST pushes
    # the close to 08:00 UTC and the 08:00 sync can just miss it.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      lookbackDays:
        description: 'History window the trainer pulls'
        default: '540'

concurrency:
  group: ml-nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install ML deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Run nightly pipeline
        id: pipeline
        env:
          LOG_FILE: logs/ml-nightly.log
        run: .github/scripts/run-with-cron-logging.sh python -m ml.run_nightly

      # F21 — fan-out AnomalyEvent rows into the unified Alert inbox.
      # Failure is non-fatal: alerts are a UX surface on top of detection
      # results that already landed in this job's main step.
      - name: Ingest alerts
        if: success()
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Was `secrets.ALERTS_INGEST_URL`, a bespoke secret no other workflow
          # used and which was never set — so this step silently skipped on
          # every run and the Alert table stayed empty from the day F21 shipped.
          # APP_URL is the base every other cron step here uses.
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set — skipping."
            exit 0
          fi
          curl -sS -X POST "$APP_URL/api/cron/alerts-ingest" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"sinceDays": 14}' \
            --max-time 110

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-nightly-log-${{ github.run_id }}
          path: logs/ml-nightly.log
          retention-days: 14

      - name: Open or update incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ML Nightly
          ISSUE_TITLE: "[Auto] ML Nightly failing"
          ISSUE_LABEL: cron-failure
          LOG_FILE: logs/ml-nightly.log
          FAILED_EXIT_CODE: ${{ steps.pipeline.outputs.status }}
        run: bash .github/scripts/report-workflow-failure.sh
      - name: Close incident issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ML Nightly
          ISSUE_TITLE: "[Auto] ML Nightly failing"
          ISSUE_LABEL: cron-failure
        run: bash .github/scripts/report-workflow-recovery.sh
