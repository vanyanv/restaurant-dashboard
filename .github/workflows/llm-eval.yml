name: LLM golden set

# The paid half of scripts/eval-llm. It calls the real models, so it does not
# run on every push — a full pass is ~29 cases and about $0.04, which is cheap
# per run and not cheap on every commit against a $5 budget.
#
# The enforcement is NOT here. `npm test` carries a fingerprint of every
# rendered prompt plus the model it is sent to, and fails the moment either
# changes without the recorded scorecard being refreshed. That gate is free and
# runs on everything. This workflow is what you run to satisfy it, and what
# answers the question no fixture can: does the CURRENT prompt still get the
# CURRENT model to behave.
on:
  pull_request:
    branches: [main]
    paths:
      # The prompt templates and the model constants themselves.
      - 'src/lib/decision-verdict-llm.ts'
      - 'src/lib/proposal-llm.ts'
      - 'src/lib/ingredient-match-llm.ts'
      - 'src/lib/chat/system-prompt.ts'
      - 'src/lib/chat/openai-client.ts'
      - 'src/lib/chat/tools/**'
      # The five that decide what the model is offered and what it is told,
      # and were not watched. `tool-groups.ts` narrows a turn to as few as
      # nine of fifty-eight schemas; the classifier picks those groups when
      # the page establishes no department; the route assembles both and
      # carries the answer cache and the freshness stamps that key it. Two of
      # the four correctness defects the 2026-09-19 audit found lived in files
      # on this list and none of them would have fired this job.
      - 'src/lib/chat/tool-groups.ts'
      - 'src/lib/chat/tool-group-classifier.ts'
      - 'src/lib/chat/answer-cache.ts'
      - 'src/lib/chat/data-as-of.ts'
      - 'src/app/api/chat/route.ts'
      # Was 'src/app/dashboard/decisions/lib/verdict-copy.ts', a path that has
      # not existed since the decisions lib moved. A trigger on a file that is
      # not there never fires and never complains.
      - 'src/lib/decisions/verdict-copy.ts'
      - 'scripts/eval-llm/**'
      - '.github/workflows/llm-eval.yml'
  workflow_dispatch:
    inputs:
      feature:
        description: 'One of: verdict, proposal, adjudicator, chat-tool-choice. Blank runs all.'
        required: false
        type: string

concurrency:
  group: llm-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # A missing key makes this job dormant rather than red. The free gate in
      # `npm test` is what actually blocks a prompt change from merging
      # unmeasured; this job only adds the live number. Failing every PR that
      # touches a prompt because a secret was never configured would train
      # people to ignore both.
      - name: Check for an API key
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY is not configured, so the live golden-set run is dormant. Add the secret to enable it; until then run \`npm run eval:llm\` locally when a prompt changes."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # `pendingReEval` marks a hash refreshed without a live run behind it.
      # `tests/scripts/eval-llm-fingerprint.test.ts` already forces such a
      # record to zero its numbers, so it cannot vouch for a pass nobody
      # measured -- but nothing made it TEMPORARY. With a key configured there
      # is no excuse for carrying one, and `--record` rebuilds the record
      # without the flag, so this step fails the PR if that was not done.
      - name: Carried-forward scorecard
        if: always()
        env:
          HAVE_KEY: ${{ steps.key.outputs.present }}
        run: |
          stale=$(node -e "
            const f = require('./scripts/eval-llm/fingerprints.json');
            const s = Object.entries(f).filter(([, r]) => r.pendingReEval).map(([k]) => k);
            process.stdout.write(s.join(' '));
          ")
          if [ -z "$stale" ]; then exit 0; fi
          if [ "$HAVE_KEY" = "true" ]; then
            echo "::error::$stale carries pendingReEval with an API key configured. Run 'npm run eval:llm -- --record' and commit scripts/eval-llm/fingerprints.json."
            exit 1
          fi
          echo "::warning::$stale carries pendingReEval: its scorecard is zeroed and the prompt is unmeasured. Configure OPENAI_API_KEY, or run 'npm run eval:llm -- --record' locally."

      - name: Run the golden set
        if: steps.key.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Imported for its tool catalogue only — src/lib/chat/tools builds a
          # Prisma client at module load. Every tool's execute is stubbed in the
          # eval, so nothing here reads or writes a row.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          if [ -n "${{ inputs.feature }}" ]; then
            npm run eval:llm -- --feature "${{ inputs.feature }}" | tee /tmp/eval.log
          else
            npm run eval:llm | tee /tmp/eval.log
          fi

      - name: Scorecard
        if: always() && steps.key.outputs.present == 'true'
        run: |
          {
            echo '## LLM golden set'
            echo
            echo '```'
            tail -20 /tmp/eval.log 2>/dev/null || echo 'no output'
            echo '```'
            echo
            echo 'A feature below its floor fails this job. To refresh the recorded'
            echo 'scorecard after a deliberate prompt change, run `npm run eval:llm -- --record`'
            echo 'locally and commit `scripts/eval-llm/fingerprints.json`.'
          } >> "$GITHUB_STEP_SUMMARY"
