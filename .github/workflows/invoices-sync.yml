name: Invoices Sync
on:
  schedule:
    # Three times a day: 6 AM, noon and 6 PM Los Angeles time (owner,
    # 2026-11-20; it ran every 15 minutes all day and night until then, which
    # kept the database awake). sync-ticker.yml dispatches these same hours on
    # time; this schedule is the backup, since GitHub fires schedules hours
    # late. GitHub runs on UTC, so in summer (PDT) these are 7 AM, 1 PM, 7 PM.
    # A run reads six emails per call, but invoices-sync-drain.sh keeps calling
    # while emails are deferred, so a backlog clears in one run. A run with
    # nothing new is one mail search. Concurrency lock prevents pile-up.
    # "Run workflow" below still pulls at any hour.
    # Catch-up after an outage: "Run workflow" with lookback_days set to the
    # days since the last good run. The sync keeps that window open across
    # runs until nothing is deferred, skips every email already stored, and
    # puts each bill through the same checks as a normal run. (This replaced
    # scripts/backfill-invoice-emails.ts, deleted 2026-11-20: it skipped
    # verification, duplicate-bill and statement checks, pack-size correction
    # and returns.)
    - cron: '0 2,14,20 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Search this many days back (backfill). Blank = normal run."
        required: false
        default: ""

concurrency:
  group: invoices-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: POST /api/invoices/sync
        id: cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LOG_FILE: logs/invoices-sync.log
          CRON_RETRIES: "2"
          CRON_MAX_TIME: "115"
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
        run: |
          url="$APP_URL/api/invoices/sync"
          if [[ "$LOOKBACK_DAYS" =~ ^[0-9]+$ ]]; then url="$url?lookbackDays=$LOOKBACK_DAYS"; fi
          bash .github/scripts/run-with-cron-logging.sh \
            bash .github/scripts/invoices-sync-drain.sh "$url"
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: invoices-sync-log-${{ github.run_id }}
          path: logs/invoices-sync.log
          retention-days: 14
      - name: Open or update incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Invoices Sync
          ISSUE_TITLE: "[Auto] Invoices Sync failing"
          ISSUE_LABEL: cron-failure
          LOG_FILE: logs/invoices-sync.log
          FAILED_EXIT_CODE: ${{ steps.cron.outputs.status }}
        run: bash .github/scripts/report-workflow-failure.sh
      - name: Close incident issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Invoices Sync
          ISSUE_TITLE: "[Auto] Invoices Sync failing"
          ISSUE_LABEL: cron-failure
        run: bash .github/scripts/report-workflow-recovery.sh
