name: Invoices Sync
on:
  schedule:
    # Hourly at :30 since 2026-10-28. Every 6h was enough for new mail but a
    # run reads only six emails, so any backlog took days to clear (13 were
    # still waiting on 2026-10-28). Concurrency lock prevents pile-up.
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Search this many days back (backfill). Blank = normal run."
        required: false
        default: ""

concurrency:
  group: invoices-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: POST /api/invoices/sync
        id: cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LOG_FILE: logs/invoices-sync.log
          CRON_RETRIES: "2"
          CRON_MAX_TIME: "115"
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
        run: |
          url="$APP_URL/api/invoices/sync"
          if [[ "$LOOKBACK_DAYS" =~ ^[0-9]+$ ]]; then url="$url?lookbackDays=$LOOKBACK_DAYS"; fi
          bash .github/scripts/run-with-cron-logging.sh \
            .github/scripts/curl-cron-json.sh POST "$url"
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: invoices-sync-log-${{ github.run_id }}
          path: logs/invoices-sync.log
          retention-days: 14
      - name: Open or update incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Invoices Sync
          ISSUE_TITLE: "[Auto] Invoices Sync failing"
          ISSUE_LABEL: cron-failure
          LOG_FILE: logs/invoices-sync.log
          FAILED_EXIT_CODE: ${{ steps.cron.outputs.status }}
        run: bash .github/scripts/report-workflow-failure.sh
      - name: Close incident issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Invoices Sync
          ISSUE_TITLE: "[Auto] Invoices Sync failing"
          ISSUE_LABEL: cron-failure
        run: bash .github/scripts/report-workflow-recovery.sh
