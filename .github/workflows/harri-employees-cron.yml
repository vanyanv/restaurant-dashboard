name: Harri Employees Weekly Refresh
on:
  schedule:
    # 07:00 UTC every Monday. Weekly rather than monthly because store checks
    # hand out PINs from this roster, and a new hire should not wait a month.
    # Hot paths (hourly labor sync, alert reads) never call the team endpoint —
    # they read names from the HarriEmployee cache.
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: harri-employees-cron
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Refresh Harri team directory
        id: cron
        # run-with-cron-logging.sh sets pipefail and writes `status`; a bare
        # `| tee` under Actions' default shell reported tee's exit code, so a
        # failed refresh read green.
        run: |
          bash .github/scripts/run-with-cron-logging.sh \
            npx tsx scripts/backfill-harri-employees.ts
        env:
          LOG_FILE: logs/harri-employees-cron.log
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HARRI_COGNITO_CLIENT_ID: ${{ secrets.HARRI_COGNITO_CLIENT_ID }}
          HARRI_COGNITO_USER_POOL_REGION: ${{ secrets.HARRI_COGNITO_USER_POOL_REGION }}
          HARRI_REFRESH_TOKEN: ${{ secrets.HARRI_REFRESH_TOKEN }}
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harri-employees-cron-log-${{ github.run_id }}
          path: logs/harri-employees-cron.log
          retention-days: 14
      - name: Open or update incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Harri Employees Weekly Refresh
          ISSUE_TITLE: "[Auto] Harri Employees Weekly Refresh failing"
          ISSUE_LABEL: cron-failure
          LOG_FILE: logs/harri-employees-cron.log
          FAILED_EXIT_CODE: ${{ steps.cron.outputs.status }}
        run: bash .github/scripts/report-workflow-failure.sh
      - name: Close incident issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Harri Employees Weekly Refresh
          ISSUE_TITLE: "[Auto] Harri Employees Weekly Refresh failing"
          ISSUE_LABEL: cron-failure
        run: bash .github/scripts/report-workflow-recovery.sh
