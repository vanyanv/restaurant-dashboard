name: COGS Sweep (4-hour, 3 days)
on:
  schedule:
    # Twice a day (3 PM and 3 AM LA), an hour after the 2 PM and 2 AM Otter
    # syncs. sync-ticker.yml dispatches these on time; this is the backup.
    # Was every 4 hours until 2026-11-23 (cut for Vercel active CPU). Window
    # is the last 3 days; the weekly 30-day refresh catches older corrections.
    - cron: '30 23,11 * * *'
  workflow_dispatch:
    inputs:
      lookbackDays:
        description: 'Days to recompute (default 3)'
        default: '3'
      force:
        description: 'Include empty stores and bypass source-change skip'
        default: 'false'

concurrency:
  group: cogs-sweep
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # One job on the runner since 2026-11-26. This used to be two jobs that
  # called the Vercel app: GET /api/cron/cogs/stores, then a matrix of
  # POST /api/cron/cogs/sweep, one per store. The recompute is the app's most
  # processor-heavy background job and all of it counted against the Vercel
  # Hobby plan's 4 hours of Active CPU a month. scripts/sweep-cogs.ts runs the
  # same code here instead (src/lib/cogs-sweep-job.ts): same store list, same
  # source-change skip, same cogs.stores and cogs.sweep JobRun rows. Stores go
  # one after another; a store that fails does not stop the rest, and the step
  # fails at the end if any did.
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Sweep COGS (last ${{ github.event.inputs.lookbackDays || '3' }} days)
        id: cron
        run: |
          bash .github/scripts/run-with-cron-logging.sh \
            npx tsx scripts/sweep-cogs.ts "$LOOKBACK" "--force=$FORCE"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # The sweep retires the saved figures of the days it rewrote
          # (src/lib/cache). Without these they stay pre-sweep for up to 6h.
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          LOOKBACK: ${{ github.event.inputs.lookbackDays || '3' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          LOG_FILE: logs/cogs-sweep.log
          CRON_RETRIES: "2"
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cogs-sweep-log-${{ github.run_id }}
          path: logs/cogs-sweep.log
          retention-days: 14
      - name: Open or update incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: COGS Sweep
          ISSUE_TITLE: "[Auto] COGS Sweep failing"
          ISSUE_LABEL: cron-failure
          LOG_FILE: logs/cogs-sweep.log
          FAILED_EXIT_CODE: ${{ steps.cron.outputs.status }}
        run: bash .github/scripts/report-workflow-failure.sh
      - name: Close incident issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: COGS Sweep
          ISSUE_TITLE: "[Auto] COGS Sweep failing"
          ISSUE_LABEL: cron-failure
        run: bash .github/scripts/report-workflow-recovery.sh
