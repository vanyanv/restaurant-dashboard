name: Otter Orders Sync
on:
  schedule:
    # Backup only: sync-ticker.yml dispatches this four times a day. The old
    # every-4-hours backup fired hours late and doubled the runs, so since
    # 2026-11-23 the backup is once a day, after close (2 AM LA).
    - cron: '15 10 * * *'
  workflow_dispatch:
    inputs:
      # Blank is the normal 3-day run, and is skipped when a run succeeded in
      # the last 20 minutes (the ticker's dispatch and the backup schedule
      # often land on the same window). Any number is an explicit backfill
      # and always runs.
      days:
        description: 'Lookback window (1-14). Blank = normal 3-day run.'
        required: false
        default: ''

concurrency:
  group: otter-orders-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Sync Otter orders
        id: sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Cache busts and closed-range version bumps (src/lib/cache). Without
          # these the sync's writes leave saved figures pre-sync for up to 6h.
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          OTTER_JWT: ${{ secrets.OTTER_JWT }}
          OTTER_EMAIL: ${{ secrets.OTTER_EMAIL }}
          OTTER_PASSWORD: ${{ secrets.OTTER_PASSWORD }}
          DAYS: ${{ github.event.inputs.days || '3' }}
          DAYS_INPUT: ${{ github.event.inputs.days || '' }}
          LOG_FILE: logs/otter-orders-sync.log
          CRON_RETRIES: "2"
        run: |
          skip=""
          if [ -z "$DAYS_INPUT" ]; then skip="--skip-if-recent"; fi
          bash .github/scripts/run-with-cron-logging.sh \
            npx tsx scripts/sync-otter-orders.ts --days="$DAYS" $skip
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: otter-orders-sync-log-${{ github.run_id }}
          path: logs/otter-orders-sync.log
          retention-days: 14
      - name: Open or update incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Otter Orders Sync
          ISSUE_TITLE: "[Auto] Otter Orders Sync failing"
          ISSUE_LABEL: cron-failure
          LOG_FILE: logs/otter-orders-sync.log
          FAILED_EXIT_CODE: ${{ steps.sync.outputs.status }}
        run: bash .github/scripts/report-workflow-failure.sh
      - name: Close incident issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Otter Orders Sync
          ISSUE_TITLE: "[Auto] Otter Orders Sync failing"
          ISSUE_LABEL: cron-failure
        run: bash .github/scripts/report-workflow-recovery.sh
