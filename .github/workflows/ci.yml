name: CI
# Enforces typecheck + unit tests + ML pytest on every PR. Previously only
# bundle-budget ran on PRs, so tsc/vitest/pytest regressions could merge freely.
# scripts/ and .github/scripts/ are in the path filters because a change
# touching only a cron entrypoint used to skip CI entirely — including the
# typecheck:scripts step that exists to catch exactly that. The two lists are
# duplicated rather than shared via a YAML anchor: GitHub Actions' parser does
# not support anchors, and a silently-unparsed filter would disable CI.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'prisma/**'
      - 'ml/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.scripts.json'
      - 'pytest.ini'
      - 'vitest.config.*'
      - '.github/workflows/ci.yml'
  # Work reaches main by direct push here as often as by PR, and a
  # pull_request-only trigger means those commits are never checked at all.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'prisma/**'
      - 'ml/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.scripts.json'
      - 'pytest.ini'
      - 'vitest.config.*'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history, not just the tip commit. scripts/counter-lint.ts's
          # LEGACY exemption diffs each legacy file against its content at a
          # fixed baseline commit (`git show <baseline>:<path>`); at the
          # default fetch-depth: 1 that commit is unreachable and the check
          # fails identically for every legacy file, which used to flood
          # `npm run tokens` (and tests/styles/counter-lint.test.ts, which
          # runs under `npm test`) with false violations. See
          # BaselineUnreachableError in scripts/counter-lint.ts.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # next-env.d.ts is gitignored and generated, so tsc on a fresh checkout
      # could not resolve the image-module declarations it provides. Both CI
      # runs this workflow has ever had failed here, which meant the typecheck
      # gate it advertises has never actually run. typegen writes it without
      # paying for a full build.
      - name: Generate Next types
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Typecheck cron scripts
        # scripts/ is outside the main tsconfig; without this a bare
        # ReferenceError in a cron entrypoint only surfaces in production.
        run: npm run typecheck:scripts
      - name: Unit tests
        run: npm test

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt
      - name: ML tests
        run: pytest
