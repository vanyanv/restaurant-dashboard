name: CI
# Enforces typecheck + unit tests + ML pytest on every PR. Previously only
# bundle-budget ran on PRs, so tsc/vitest/pytest regressions could merge freely.
# scripts/ and .github/scripts/ are in the path filters because a change
# touching only a cron entrypoint used to skip CI entirely — including the
# typecheck:scripts step that exists to catch exactly that. The two lists are
# duplicated rather than shared via a YAML anchor: GitHub Actions' parser does
# not support anchors, and a silently-unparsed filter would disable CI.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'prisma/**'
      - 'ml/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.scripts.json'
      - 'pytest.ini'
      - 'vitest.config.*'
      - 'eslint.config.mjs'
      - 'playwright.config.ts'
      - 'e2e/**'
      - '.github/workflows/ci.yml'
  # Work reaches main by direct push here as often as by PR, and a
  # pull_request-only trigger means those commits are never checked at all.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'prisma/**'
      - 'ml/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.scripts.json'
      - 'pytest.ini'
      - 'vitest.config.*'
      - 'eslint.config.mjs'
      - 'playwright.config.ts'
      - 'e2e/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history, not just the tip commit. scripts/counter-lint.ts's
          # LEGACY exemption diffs each legacy file against its content at a
          # fixed baseline commit (`git show <baseline>:<path>`); at the
          # default fetch-depth: 1 that commit is unreachable and the check
          # fails identically for every legacy file, which used to flood
          # `npm run tokens` (and tests/styles/counter-lint.test.ts, which
          # runs under `npm test`) with false violations. See
          # BaselineUnreachableError in scripts/counter-lint.ts.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # next-env.d.ts is gitignored and generated, so tsc on a fresh checkout
      # could not resolve the image-module declarations it provides. Both CI
      # runs this workflow has ever had failed here, which meant the typecheck
      # gate it advertises has never actually run. typegen writes it without
      # paying for a full build.
      - name: Generate Next types
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Typecheck cron scripts
        # scripts/ is outside the main tsconfig; without this a bare
        # ReferenceError in a cron entrypoint only surfaces in production.
        run: npm run typecheck:scripts
      - name: React hooks and compiler rules
        # React Compiler silently skips any component that breaks these rules.
        # The script's --max-warnings is the count when this step landed:
        # CI fails if it goes up. Lower it as findings are fixed.
        run: npm run lint:hooks
      - name: Unit tests
        run: npm test
      - name: Counter rules
        # CLAUDE.md's whole-project gate and DESIGN.md both say this "fails
        # the build" -- it needs the full-history checkout above (C2 fix) or
        # it fails loudly for the wrong reason instead.
        run: npm run tokens

  e2e:
    # The click-through suite under e2e/ (desktop + mobile, including the axe
    # accessibility sweeps). It used to run only when someone ran it by hand.
    # It runs against a throwaway Postgres seeded with the demo account, never
    # a real database, so pages assert on shape and states, not on figures.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Report-only for now. The first run (2026-11-17, local, demo seed) had 15
    # of 30 failing, none from the change that added this job: stale fixture
    # ids, the Speed Insights script 404ing off Vercel, data the demo seed
    # does not have. Remove this line once that list is fixed, so a red e2e
    # blocks a merge like the web job does.
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/e2e
      NEXTAUTH_SECRET: ci-placeholder
      NEXTAUTH_URL: http://localhost:3100
      E2E_USER_EMAIL: demo@restaurantos.com
      E2E_USER_PASSWORD: demo123
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Create schema and seed the demo account
        run: |
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector'
          npx prisma db push
          npm run db:seed
      - name: Browser tests (desktop + mobile)
        run: npx playwright test --project=desktop --project=mobile --trace off
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt
      - name: ML tests
        run: pytest
